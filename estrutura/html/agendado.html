<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doação de pets</title>
  <link rel="icon" type="image/png" href="../../fotos/logo-pet.png">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #cfeff4;
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      background-color: #ffffff;
      padding: 40px 50px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      max-width: 400px;
      width: 90%;
    }

    .container h1 {
      margin-bottom: 20px;
      color: #2b6f73;
      font-size: 26px;
    }

    .btn-voltar {
      display: inline-block;
      background-color: #4fa3a5;
      color: white;
      padding: 12px 25px;
      text-decoration: none;
      border-radius: 8px;
      font-size: 16px;
      transition: background-color 0.3s ease;
    }

    .btn-voltar:hover {
      background-color: #3c8c8e;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Agendamento concluído com êxito!</h1>
    <a href="../html/index.html" class="btn-voltar">Voltar para o início</a>
  </div>

</body>
</html>
